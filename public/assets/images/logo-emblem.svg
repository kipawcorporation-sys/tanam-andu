<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12382c"/>
      <stop offset="100%" stop-color="#0a221b"/>
    </linearGradient>
    <path id="textArcTop" d="M 26 80 A 54 54 0 0 1 134 80" fill="none"/>
    <path id="textArcBottom" d="M 134 80 A 54 54 0 0 1 26 80" fill="none"/>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="80" cy="80" r="76" fill="url(#pineGrad)" stroke="#12382c" stroke-width="2"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#bfd254" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="80" cy="80" r="52" fill="#0d2a21" stroke="rgba(191,210,84,0.4)" stroke-width="1"/>

  <!-- Topo Map Contour Lines in Inner Circle -->
  <path d="M 32 80 C 45 70, 60 76, 80 68 C 100 60, 115 65, 128 80" fill="none" stroke="rgba(191,210,84,0.18)" stroke-width="1.2"/>
  <path d="M 36 92 C 50 84, 70 88, 80 82 C 95 76, 110 80, 124 92" fill="none" stroke="rgba(191,210,84,0.18)" stroke-width="1.2"/>
  
  <!-- Mountain Silhouette (Gn. Kerenceng 1.742m) -->
  <polygon points="40,94 68,52 86,72 100,58 120,94" fill="#164436" opacity="0.7"/>
  <polyline points="40,94 68,52 86,72 100,58 120,94" fill="none" stroke="#bfd254" stroke-width="1" opacity="0.5"/>

  <!-- Central Botanical Coffee Tree (Poster Style) -->
  <!-- Roots spreading at bottom -->
  <g stroke="#bfd254" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 80 95 L 80 108 M 80 98 L 70 110 M 80 100 L 90 110 M 74 104 L 64 112 M 86 104 L 96 112"/>
  </g>

  <!-- Tree Trunk -->
  <path d="M 77 96 L 78 72 L 74 62 M 83 96 L 82 72 L 86 62" stroke="#bfd254" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Coffee Canopy & Leaves -->
  <!-- Center top leaves -->
  <ellipse cx="80" cy="52" rx="7" ry="13" fill="#bfd254" transform="rotate(0 80 52)"/>
  <ellipse cx="68" cy="57" rx="6" ry="12" fill="#bfd254" transform="rotate(-35 68 57)"/>
  <ellipse cx="92" cy="57" rx="6" ry="12" fill="#bfd254" transform="rotate(35 92 57)"/>
  <ellipse cx="60" cy="68" rx="6" ry="12" fill="#bfd254" transform="rotate(-65 60 68)"/>
  <ellipse cx="100" cy="68" rx="6" ry="12" fill="#bfd254" transform="rotate(65 100 68)"/>

  <!-- Leaf Vein details -->
  <line x1="80" y1="40" x2="80" y2="64" stroke="#12382c" stroke-width="1"/>
  <line x1="68" y1="46" x2="76" y2="66" stroke="#12382c" stroke-width="0.8"/>
  <line x1="92" y1="46" x2="84" y2="66" stroke="#12382c" stroke-width="0.8"/>

  <!-- Ripe Coffee Cherries (Accents) -->
  <circle cx="75" cy="62" r="3" fill="#e09f3e" stroke="#12382c" stroke-width="0.5"/>
  <circle cx="85" cy="62" r="3" fill="#e09f3e" stroke="#12382c" stroke-width="0.5"/>
  <circle cx="80" cy="66" r="3" fill="#c04b3e" stroke="#12382c" stroke-width="0.5"/>
  <circle cx="70" cy="70" r="2.5" fill="#e09f3e" stroke="#12382c" stroke-width="0.5"/>
  <circle cx="90" cy="70" r="2.5" fill="#c04b3e" stroke="#12382c" stroke-width="0.5"/>

  <!-- Circular Text: PLANT FOR FUN (Top Arc) -->
  <text font-family="'Bitter', 'Playfair Display', Georgia, serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PLANT FOR FUN
    </textPath>
  </text>

  <!-- Circular Text: KERENCENG • 1.742M (Bottom Arc) -->
  <text font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#bfd254" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      KERENCENG • 1.742M
    </textPath>
  </text>

  <!-- Stars on sides -->
  <text x="20" y="83" font-size="9" fill="#bfd254" text-anchor="middle">★</text>
  <text x="140" y="83" font-size="9" fill="#bfd254" text-anchor="middle">★</text>
</svg>