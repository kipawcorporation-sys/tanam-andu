<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7f5"/>
      <stop offset="100%" stop-color="#e8ede8"/>
    </linearGradient>

    <!-- T-Shirt Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#12382c" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- T-Shirt Fabric Gradient (Soft Black/Charcoal) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242725"/>
      <stop offset="40%" stop-color="#1c1f1d"/>
      <stop offset="100%" stop-color="#141615"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f07d"/>
      <stop offset="100%" stop-color="#bfd254"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Texture -->
  <g stroke="rgba(18,56,44,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- T-SHIRT SHAPE -->
  <g filter="url(#dropShadow)" transform="translate(0, 15)">
    <!-- Main Body and Sleeves -->
    <path d="M 280 75
             C 320 100, 480 100, 520 75
             L 630 145
             C 655 160, 675 190, 680 220
             L 620 265
             C 605 275, 585 265, 575 250
             L 555 220
             L 550 490
             C 550 505, 535 515, 520 515
             L 280 515
             C 265 515, 250 505, 250 490
             L 245 220
             L 225 250
             C 215 265, 195 275, 180 265
             L 120 220
             C 125 190, 145 160, 170 145
             Z" 
          fill="url(#shirtGrad)"/>

    <!-- Collar Rim Inner Shadow -->
    <path d="M 330 78 C 360 115, 440 115, 470 78 C 450 105, 350 105, 330 78 Z" fill="#0d0e0d"/>
    <!-- Collar Band -->
    <path d="M 330 78 C 360 115, 440 115, 470 78 C 485 85, 495 90, 500 95 C 455 130, 345 130, 300 95 C 305 90, 315 85, 330 78 Z" fill="#2b2e2c" stroke="#383d3a" stroke-width="1.5"/>

    <!-- Subtle Stitching Lines -->
    <!-- Left Sleeve Hem -->
    <line x1="130" y1="215" x2="190" y2="260" stroke="#333735" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Right Sleeve Hem -->
    <line x1="670" y1="215" x2="610" y2="260" stroke="#333735" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Bottom Hem -->
    <line x1="255" y1="505" x2="545" y2="505" stroke="#333735" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Fabric Highlights & Folds -->
    <path d="M 255 240 Q 285 360 270 480" stroke="rgba(255,255,255,0.03)" stroke-width="8" fill="none"/>
    <path d="M 545 240 Q 515 360 530 480" stroke="rgba(255,255,255,0.03)" stroke-width="8" fill="none"/>
    <path d="M 400 130 Q 390 280 405 500" stroke="rgba(255,255,255,0.02)" stroke-width="14" fill="none"/>

    <!-- PRINTED GRAPHIC ON CHEST -->
    <g transform="translate(400, 275)" text-anchor="middle">
      <!-- Graphic Frame / Arch -->
      <circle cx="0" cy="-20" r="85" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <circle cx="0" cy="-20" r="80" fill="none" stroke="#bfd254" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

      <!-- Vintage Botanical Coffee Sprout & Hands Illustration -->
      <!-- Hands silhouette -->
      <path d="M -45 15 C -35 5, -20 -5, 0 5 C 20 -5, 35 5, 45 15 C 30 25, -30 25, -45 15 Z" fill="#e8ede8" opacity="0.85"/>
      <!-- Coffee Stem -->
      <path d="M 0 5 Q -2 -25 0 -55" stroke="#bfd254" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Leaves -->
      <path d="M 0 -25 Q -25 -40 -35 -25 Q -20 -15 0 -25 Z" fill="#e8ede8" opacity="0.9"/>
      <path d="M 0 -25 Q -25 -40 -35 -25" stroke="#1c1f1d" stroke-width="1" fill="none"/>
      
      <path d="M 0 -38 Q 25 -53 35 -38 Q 20 -28 0 -38 Z" fill="#e8ede8" opacity="0.9"/>
      <path d="M 0 -38 Q 25 -53 35 -38" stroke="#1c1f1d" stroke-width="1" fill="none"/>

      <path d="M 0 -55 Q -18 -75 -15 -85 Q 0 -75 0 -55 Z" fill="#bfd254" opacity="0.95"/>
      <path d="M 0 -55 Q 18 -75 15 -85 Q 0 -75 0 -55 Z" fill="#bfd254" opacity="0.95"/>

      <!-- Coffee Cherries -->
      <circle cx="-5" cy="-20" r="4.5" fill="#c84b31"/>
      <circle cx="5" cy="-22" r="4.5" fill="#e2583e"/>
      <circle cx="0" cy="-16" r="4" fill="#9e2a1b"/>

      <!-- Brand Typography -->
      <text y="-88" font-family="'Bitter', 'Georgia', serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="4">
        PLANT FOR FUN
      </text>

      <text y="-76" font-family="'Space Mono', monospace" font-size="6.5" font-weight="700" fill="#bfd254" letter-spacing="2">
        • KERENCENG PROJECT •
      </text>

      <text y="42" font-family="'Bitter', 'Georgia', serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="2.5">
        PLANT TREES PRESERVE TOMORROW
      </text>

      <text y="56" font-family="'Space Mono', monospace" font-size="6" font-weight="600" fill="#a0a8a2" letter-spacing="1.5">
        100% ORGANIC COTTON COMBED 30S
      </text>

      <text y="68" font-family="'Space Mono', monospace" font-size="5.5" font-weight="700" fill="#bfd254" letter-spacing="2">
        MT. KERENCENG 1.742 MDPL
      </text>
    </g>

    <!-- Woven Label at Bottom Left Hem -->
    <rect x="260" y="495" width="22" height="18" fill="#bfd254" rx="2"/>
    <text x="271" y="507" font-family="'Space Mono', monospace" font-size="6" font-weight="900" fill="#12382c" text-anchor="middle">andu</text>
  </g>

  <!-- Tag overlay / Official Merchandise Stamp -->
  <g transform="translate(630, 90)">
    <circle cx="0" cy="0" r="44" fill="#12382c" stroke="#bfd254" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(191,210,84,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
    <text y="-14" font-family="'Space Mono', monospace" font-size="7" font-weight="700" fill="#bfd254" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
    <text y="2" font-family="'Bitter', serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">MERCH</text>
    <text y="14" font-family="'Space Mono', monospace" font-size="6" font-weight="600" fill="#e8ede8" text-anchor="middle">100% COTTON</text>
    <text y="24" font-family="'Space Mono', monospace" font-size="6" font-weight="700" fill="#bfd254" text-anchor="middle">★ ★ ★</text>
  </g>
</svg>
