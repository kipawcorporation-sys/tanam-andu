<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="badgeWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184b3b"/>
      <stop offset="100%" stop-color="#0e3025"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (54x54) -->
  <g transform="translate(5, 5)">
    <circle cx="27" cy="27" r="26" fill="url(#badgeWhiteGrad)" stroke="#bfd254" stroke-width="1.5"/>
    <circle cx="27" cy="27" r="23" fill="none" stroke="#bfd254" stroke-width="1" stroke-dasharray="3 2"/>
    <circle cx="27" cy="27" r="17" fill="#0d2a21" stroke="rgba(191,210,84,0.5)" stroke-width="0.8"/>
    
    <!-- Mountain Peak -->
    <polygon points="14,35 23,20 29,27 34,22 40,35" fill="#225c4b" opacity="0.9"/>
    
    <!-- Botanical Tree & Roots -->
    <g stroke="#bfd254" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M 27 34 L 27 39 M 27 35 L 23 40 M 27 35 L 31 40"/>
      <path d="M 26 34 L 26.5 25 M 28 34 L 27.5 25"/>
    </g>
    <!-- Leaves -->
    <ellipse cx="27" cy="18" rx="3.5" ry="6" fill="#bfd254"/>
    <ellipse cx="22" cy="21" rx="3" ry="5.5" fill="#bfd254" transform="rotate(-35 22 21)"/>
    <ellipse cx="32" cy="21" rx="3" ry="5.5" fill="#bfd254" transform="rotate(35 32 21)"/>
    <!-- Cherries -->
    <circle cx="25" cy="24" r="1.8" fill="#e09f3e"/>
    <circle cx="29" cy="24" r="1.8" fill="#e09f3e"/>
  </g>

  <!-- Right Typography -->
  <g transform="translate(70, 0)">
    <!-- Main Title -->
    <text x="0" y="33" font-family="'Bitter', 'Playfair Display', Georgia, serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      PLANT FOR FUN
    </text>
    
    <!-- Subtitle Line -->
    <text x="1" y="49" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#bfd254" letter-spacing="2">
      KERENCENG • COFFEE EXPEDITION
    </text>

    <!-- Accent Dot -->
    <circle cx="202" cy="26" r="3.5" fill="#bfd254"/>
  </g>
</svg>